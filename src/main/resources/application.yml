# 이 파일은 들여쓰기(스페이스 2칸)가 곧 문법입니다. 탭을 쓰거나 칸이 어긋나면 앱이 뜨지 않습니다.
# ${이름:기본값} = 환경변수가 있으면 그 값, 없으면 콜론 뒤의 기본값.
# 원래는 비밀번호를 이 파일에 직접 쓰지 않습니다. 깃에 올라가는 순간 모두에게 공개되기 때문입니다.
spring:
  application:
    name: wonit
  datasource:
    #   h2 database
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

#  # MySQL Database
#      url: jdbc:mysql://${host}:3306/${database}?useSSL=false&serverTimezone=Asia/Seoul
#      username: ${username}
#      password: ${password}
#      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # ddl-auto 옵션: create, create-drop, update, validate, none
      # - create: 테이블을 새로 만듭니다. 기존 데이터가 삭제될 수 있습니다.
      # - create-drop: 테이블을 만들고 애플리케이션 종료 시 제거합니다.
      # - update: 기존 테이블 구조를 엔티티에 맞춰 변경하려고 시도합니다.
      # - validate: 구조가 맞는지만 검사합니다.
      # - none: 스키마 관련 자동 처리를 하지 않습니다.
      ddl-auto: create
      database-platform: org.hibernate.dialect.H2Dialect

    show-sql: true            # 실행되는 SQL 을 콘솔에 찍는다
    properties:
      hibernate:
        format_sql: true      # SQL 을 줄바꿈해서 사람이 읽기 좋게 출력한다

    # Hibernate가 테이블을 생성한 후 data.sql 실행
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
  # 🤖 Spring AI: AI 프로필(gemini · openrouter · openai)을 켜지 않아도 앱은 떠야 한다 → 키 기본값은 가짜 값 no-key
  #    진짜 키는 프로필 파일이 환경변수에서 읽어 덮어쓴다. 🚨 이 파일에 진짜 키를 적지 않는다
  ai:
    openai:
      api-key: ${AI_API_KEY:no-key}
      max-retries: 0          # 실패하면 다시 시도하지 않고 바로 "기타" 로 대체한다
      chat:
        model: ${AI_MODEL:gpt-4o-mini}  # 수업 당일 사이트에서 저렴한 모델 이름 확인
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
#      openai:
#        base-url: https://generativelanguage.googleapis.com/v1beta/openai
#        api-key: ${GEMINI_API_KEY}              # 🚨 키는 환경변수에서만 읽는다
#        chat:
#          model: ${AI_MODEL:gemini-3.5-flash-lite}  # 수업 당일 사이트에서 저렴한 모델 이름 확인
#        embedding:
#          options:
#            model: ${AI_EMBEDDING_MODEL:gemini-embedding-001}
# Gemini 의 "OpenAI 호환" 주소를 쓴다.  실행: GEMINI_API_KEY=... ./gradlew bootRun --args='--spring.profiles.active=gemini'
#  ai:
#    openai:
#      base-url: https://generativelanguage.googleapis.com/v1beta/openai
#      api-key: ${GEMINI_API_KEY}              # 🚨 키는 환경변수에서만 읽는다
#      chat:
#        model:  ${AI_MODEL:gemini-3.5-flash-lite}  # 수업 당일 사이트에서 저렴한 모델 이름 확인
#      embedding:
#        options:
#          model: ${AI_EMBEDDING_MODEL:gemini-embedding-001}   # (선택) RAG 용 임베딩 모델. 이름은 수업 당일 확인
#    # 📚 (선택) RAG 임베딩(글 → 숫자 벡터)은 Gemini 전용 연결로 만든다 (키는 위와 같은 GEMINI_API_KEY)
#    #    🚨 위의 "OpenAI 호환" 주소로 임베딩하면 응답에 index 가 빠져 있어서 Spring AI 2.0.1 이 "`index` is not set" 으로 실패한다
#    google:
