# 이 파일은 들여쓰기(스페이스 2칸)가 곧 문법입니다. 탭을 쓰거나 칸이 어긋나면 앱이 뜨지 않습니다.
# ${이름:기본값} = 환경변수가 있으면 그 값, 없으면 콜론 뒤의 기본값.
# 원래는 비밀번호를 이 파일에 직접 쓰지 않습니다. 깃에 올라가는 순간 모두에게 공개되기 때문입니다.
spring:
  application:
    name: wonit
  datasource:
    #   h2 database
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

#  # MySQL Database
#      url: jdbc:mysql://${host}:3306/${database}?useSSL=false&serverTimezone=Asia/Seoul
#      username: ${username}
#      password: ${password}
#      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # ddl-auto 옵션: create, create-drop, update, validate, none
      # - create: 테이블을 새로 만듭니다. 기존 데이터가 삭제될 수 있습니다.
      # - create-drop: 테이블을 만들고 애플리케이션 종료 시 제거합니다.
      # - update: 기존 테이블 구조를 엔티티에 맞춰 변경하려고 시도합니다.
      # - validate: 구조가 맞는지만 검사합니다.
      # - none: 스키마 관련 자동 처리를 하지 않습니다.
      ddl-auto: create
      database-platform: org.hibernate.dialect.H2Dialect

    show-sql: true            # 실행되는 SQL 을 콘솔에 찍는다
    properties:
      hibernate:
        format_sql: true      # SQL 을 줄바꿈해서 사람이 읽기 좋게 출력한다

    # Hibernate가 테이블을 생성한 후 data.sql 실행
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
  # 🤖 Spring AI: AI 프로필(gemini · openrouter · openai)을 켜지 않아도 앱은 떠야 한다 → 키 기본값은 가짜 값 no-key
  #    진짜 키는 프로필 파일이 환경변수에서 읽어 덮어쓴다. 🚨 이 파일에 진짜 키를 적지 않는다
  ai:
    openai:
      api-key: ${AI_API_KEY:no-key}
      max-retries: 0          # 실패하면 다시 시도하지 않고 바로 "기타" 로 대체한다

# 한글이 들어가면 깨지는 경우들이 종종 있습니다. 개발시 처음에 꼭 확인 필요
# .env 안에 추가한 title 환경변수를 가져와서 사용해보십시오.
# ${변수명:기본값} = 환경변수가 있으면 그 값, 없으면 콜론 뒤의 기본값.
app:
  title: ${title:스프링부트 어플리케이션 3}

logging:
  level:
    root: INFO    # 스프링부트이 모든 환경
    com.example.wonit: DEBUG                   # 우리 패키지만 자세히
    org.hibernate.SQL: DEBUG                   # 실행되는 SQL (show-sql 대신 이것을 권장: 로그 형식·레벨을 따름)
    org.hibernate.orm.jdbc.bind: TRACE         # SQL 의 ? 자리에 실제로 들어간 값
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG   # Creating new transaction → commit / rollback 이 찍힌다

#  file:
#    name: logs/wonit.log

server:
  port: 8080