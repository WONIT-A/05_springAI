# 🐬 MySQL(예: AWS RDS)로 실행: --spring.profiles.active=mysql
# 주소 · 계정 · 비밀번호는 환경변수로만 받는다 (이 파일 · 깃에 적지 않는다). JWT 비밀키도 JWT_SECRET 으로 꼭 바꾼다
#   DB_URL=jdbc:mysql://<RDS 엔드포인트>:3306/bankdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#   DB_USERNAME=...   DB_PASSWORD=...
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update      # 처음 실행 때 표를 만들고, 다시 켜도 데이터를 지우지 않는다 (실무는 validate + Flyway 같은 도구)
  sql:
    init:
      mode: never           # data.sql 은 H2 용 시드라 넣지 않는다. 데모 고객 · 계좌는 처음 한 번 직접 넣는다
  h2:
    console:
      enabled: false        # 진짜 DB 를 쓸 때는 H2 콘솔을 끈다
