# docker compose up --build -d
# docker compose down
# 볼륨까지 삭제하며 내리고자 할 때는
# docker compose down -v
# docker compose exec db mysql --default-character-set=utf8mb4 -u bank -p bankdb
services:
  front:
    image: node:22-alpine
    container_name: front
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0" # npm ci: package-lock.json에 기록된 버전 그대로 의존성 설치
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: bankdb
      MYSQL_USER: bank
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # utf8mb4는 한글을 포함한 유니코드 문자를 저장합니다. 새 DB와 테이블의 기본값으로 사용됩니다.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql  # MySQL 데이터를 컨테이너 밖에 보관해 재생성 후에도 유지
    healthcheck:               # DB가 접속 가능한 상태인지 주기적으로 확인
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    depends_on:                # DB가 준비된 뒤 백엔드 시작
      db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mysql}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DB_URL: ${DB_URL:-jdbc:mysql://db:3306/bankdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      DB_USERNAME: bank
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:mysql://db:3306/bankdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: bank
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-no-key}
    ports:
      - "8080:8080"
    networks:                  # 같은 네트워크의 서비스 이름으로 서로 접속
      - app-network

volumes:
  dbdata:                      # Docker가 관리하는 영속 데이터 저장소

networks:
  app-network:
    driver: bridge             # 호스트 안에서 컨테이너끼리 통신하는 네트워크
